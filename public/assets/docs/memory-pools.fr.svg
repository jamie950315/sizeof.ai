<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">Mémoire GPU dédiée et mémoire unifiée Apple</title><desc id="desc">Les systèmes à GPU dédié ont une RAM système et une VRAM GPU séparées. La mémoire unifiée Apple est un pool physique partagé par le CPU et le GPU. Dans les deux cas, il faut de la place pour les poids, l’état du modèle, les espaces de travail et les autres applications. Les blocs ne sont pas à l’échelle.</desc>
<style>
.bg{fill:#fbfaf6}.ink,.t1{fill:#16150f}.t2{fill:#47443c}.t3{fill:#6b675d}.ln{fill:none;stroke:#16150f}.box{fill:#fbfaf6;stroke:#16150f}
.soft{fill:#f6f4ee;stroke:#c3beb0}.os{fill:#d9d5c9;stroke:#16150f}.rl{fill:none;stroke:#6b675d}.tape{fill:#ffcd05}
@media (prefers-color-scheme:dark){.bg{fill:#1a1a16}.ink,.t1{fill:#eeece4}.t2{fill:#bdb9ad}.t3{fill:#959186}.ln{stroke:#eeece4}.box{fill:#1a1a16;stroke:#eeece4}
.soft{fill:#1f1f1a;stroke:#45433b}.os{fill:#45433b;stroke:#eeece4}.rl{stroke:#959186}}
text{font-family:'Schibsted Grotesk Variable','Schibsted Grotesk',system-ui,-apple-system,'Segoe UI','Noto Sans',sans-serif}
</style>
<defs>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" class="bg"/><path d="M0 0V7" class="ln" stroke-width="2.2"/></pattern>
<pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" class="bg"/><circle cx="3.5" cy="3.5" r="1.35" class="ink"/></pattern>
</defs>
<rect width="1100" height="620" class="bg"/>
<text x="40" y="52" font-size="24" font-weight="700" class="t1" data-fit="1010" data-rtl-x="1060">Où se trouve la mémoire du modèle ?</text>
<text x="40" y="81" font-size="15" class="t2" data-fit="1010" data-rtl-x="1060">Répartition conceptuelle de la mémoire · pas à l’échelle</text>
<path d="M40 106H1060" class="rl" stroke-dasharray="2 4"/>
<text x="40" y="140" font-size="20" font-weight="650" class="t1" data-fit="460" data-rtl-x="500">GPU dédié</text>
<text x="600" y="140" font-size="20" font-weight="650" class="t1" data-fit="460" data-rtl-x="1060">Mémoire unifiée Apple</text>

<rect x="40.5" y="162.5" width="459" height="109" rx="4" class="soft"/>
<text x="62" y="194" font-size="17" font-weight="650" class="t1" data-fit="416" data-rtl-x="478">RAM système · CPU</text>
<text x="62" y="226" font-size="14.5" class="t2" data-fit="416" data-rtl-x="478">OS, applications, chargement et délestage éventuel</text>
<path d="M270 278V310M263 302l7 8 7-8" class="ln" stroke-width="1.5"/>
<text x="288" y="299" font-size="13" class="t3" data-fit="200" data-rtl-x="252">Transferts de données</text>

<rect x="40.5" y="322.5" width="459" height="209" rx="4" class="box" stroke-width="1.5"/>
<rect x="40" y="322" width="460" height="5" class="tape"/>
<text x="62" y="358" font-size="17" font-weight="650" class="t1" data-fit="416" data-rtl-x="478">VRAM GPU · capacité séparée</text>
<rect x="62.5" y="378.5" width="415" height="33" class="box"/><rect x="62.5" y="378.5" width="44" height="33" class="ink"/>
<text x="120" y="400" font-size="14.5" class="t1" data-fit="350" data-rtl-x="466">Poids du modèle résidents</text>
<rect x="62.5" y="422.5" width="415" height="33" class="box"/><rect x="62.5" y="422.5" width="44" height="33" fill="url(#hatch)"/><rect x="62.5" y="422.5" width="44" height="33" class="ln"/>
<text x="120" y="444" font-size="14.5" class="t1" data-fit="350" data-rtl-x="466">Cache KV / état propre à l’architecture</text>
<rect x="62.5" y="466.5" width="415" height="33" class="box"/><rect x="62.5" y="466.5" width="44" height="33" fill="url(#dots)"/><rect x="62.5" y="466.5" width="44" height="33" class="ln"/>
<text x="120" y="488" font-size="14.5" class="t1" data-fit="350" data-rtl-x="466" textLength="350" lengthAdjust="spacingAndGlyphs">Espaces de travail de l’environnement d’exécution et autres allocations</text>

<rect x="600.5" y="162.5" width="214" height="51" rx="4" class="soft"/><text x="707" y="194" font-size="17" font-weight="650" text-anchor="middle" class="t1">CPU</text>
<rect x="845.5" y="162.5" width="214" height="51" rx="4" class="soft"/><text x="952" y="194" font-size="17" font-weight="650" text-anchor="middle" class="t1">GPU</text>
<path d="M707 214V246H952V214M830 246V256M830 282V294" class="ln" stroke-width="1.5"/>
<text x="830" y="274" font-size="13" text-anchor="middle" class="t3" data-fit="440">Accèdent au même pool de mémoire physique</text>

<rect x="600.5" y="294.5" width="459" height="237" rx="4" class="box" stroke-width="1.5"/>
<rect x="600" y="294" width="460" height="5" class="tape"/>
<text x="622" y="330" font-size="17" font-weight="650" class="t1" data-fit="416" data-rtl-x="1038" textLength="416" lengthAdjust="spacingAndGlyphs">Capacité partagée · laissez de la marge au système</text>
<rect x="622.5" y="344.5" width="415" height="31" class="box"/><rect x="622.5" y="344.5" width="44" height="31" class="os"/>
<text x="680" y="365" font-size="14.5" class="t1" data-fit="350" data-rtl-x="1026">OS et autres applications</text>
<rect x="622.5" y="386.5" width="415" height="31" class="box"/><rect x="622.5" y="386.5" width="44" height="31" class="ink"/>
<text x="680" y="407" font-size="14.5" class="t1" data-fit="350" data-rtl-x="1026">Poids du modèle résidents</text>
<rect x="622.5" y="428.5" width="415" height="31" class="box"/><rect x="622.5" y="428.5" width="44" height="31" fill="url(#hatch)"/><rect x="622.5" y="428.5" width="44" height="31" class="ln"/>
<text x="680" y="449" font-size="14.5" class="t1" data-fit="350" data-rtl-x="1026">Cache KV / état propre à l’architecture</text>
<rect x="622.5" y="470.5" width="415" height="31" class="box"/><rect x="622.5" y="470.5" width="44" height="31" fill="url(#dots)"/><rect x="622.5" y="470.5" width="44" height="31" class="ln"/>
<text x="680" y="491" font-size="14.5" class="t1" data-fit="350" data-rtl-x="1026" textLength="350" lengthAdjust="spacingAndGlyphs">Espaces de travail de l’environnement d’exécution et autres allocations</text>

<path d="M40 552H1060" class="rl" stroke-dasharray="2 4"/>
<text x="40" y="578" font-size="14.5" class="t2" data-fit="1020" data-rtl-x="1060">L’espace disque est distinct des deux schémas. Un modèle qui tient sur le disque ne tient pas forcément en mémoire.</text>
<text x="40" y="602" font-size="13" class="t3" data-fit="1020" data-rtl-x="1060" textLength="1020" lengthAdjust="spacingAndGlyphs">Les limites de l’environnement d’exécution, le délestage, le partage et les pics d’allocation dépendent du périphérique, du moteur et de la charge de travail.</text>
</svg>
