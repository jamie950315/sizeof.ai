<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">專用 GPU 記憶體和 Apple 統一記憶體</title><desc id="desc">專用 GPU 系統具有獨立的系統 RAM 和 GPU VRAM。 Apple統一記憶體是CPU和GPU共享的實體池。兩者都需要空間來容納權重、模型狀態、工作空間和其他應用程式。盒子不按比例。</desc>
<rect width="1100" height="620" rx="16" fill="#111923"/>
<g font-family="system-ui,sans-serif" fill="#edf3ff">
<text x="40" y="52" font-size="24" font-weight="700">模型記憶體位於哪裡？</text>
<text x="40" y="81" font-size="15" fill="#acbbce">記憶體的概念所有權·未按比例</text>
<text x="42" y="136" font-size="21" font-weight="650">專用GPU</text>
<text x="602" y="136" font-size="21" font-weight="650">蘋果統一記憶體</text>
<rect x="40" y="162" width="460" height="110" rx="8" fill="#202d40" stroke="#5a7394"/>
<text x="62" y="193" font-size="18" font-weight="650">系統記憶體·CPU</text><text x="62" y="226" font-size="15" fill="#becae0">作業系統、應用程式、載入和可選卸載</text>
<path d="M270 278V309" stroke="#91abc9" stroke-width="2"/><path d="m262 301 8 8 8-8" fill="none" stroke="#91abc9" stroke-width="2"/>
<text x="291" y="298" font-size="13" fill="#afc0d7">資料傳輸</text>
<rect x="40" y="322" width="460" height="210" rx="8" fill="#16253d" stroke="#6793d9"/>
<text x="62" y="355" font-size="18" font-weight="650">GPU VRAM·獨立容量</text>
<rect x="62" y="378" width="416" height="34" rx="4" fill="#275fac"/><text x="77" y="401" font-size="15">常駐模型權重</text>
<rect x="62" y="422" width="416" height="34" rx="4" fill="#59488d"/><text x="77" y="445" font-size="15">KV 快取/架構特定狀態</text>
<rect x="62" y="466" width="416" height="34" rx="4" fill="#256665"/><text x="77" y="489" font-size="15">執行階段工作區和其他分配</text>
<rect x="600" y="162" width="215" height="52" rx="7" fill="#202d40" stroke="#5a7394"/><text x="685" y="195" font-size="18">CPU</text>
<rect x="845" y="162" width="215" height="52" rx="7" fill="#202d40" stroke="#5a7394"/><text x="930" y="195" font-size="18">GPU</text>
<path d="M708 219V250H950V219M830 250V257M830 282V294" fill="none" stroke="#91abc9" stroke-width="2"/>
<text x="627" y="276" font-size="13" fill="#afc0d7">存取同一個實體記憶體池</text>
<rect x="600" y="294" width="460" height="238" rx="8" fill="#16253d" stroke="#6793d9"/>
<text x="622" y="325" font-size="18" font-weight="650">共享容量·留出系統空間</text>
<rect x="622" y="344" width="416" height="32" rx="4" fill="#35445d"/><text x="637" y="366" font-size="15">作業系統和其他應用程式</text>
<rect x="622" y="386" width="416" height="32" rx="4" fill="#275fac"/><text x="637" y="408" font-size="15">常駐模型權重</text>
<rect x="622" y="428" width="416" height="32" rx="4" fill="#59488d"/><text x="637" y="450" font-size="15">KV 快取/架構特定狀態</text>
<rect x="622" y="470" width="416" height="32" rx="4" fill="#256665"/><text x="637" y="492" font-size="15">執行階段工作區和其他分配</text>
<text x="40" y="572" font-size="15" fill="#bfcee2">磁碟空間與兩個圖是分開的。適合磁碟的模型並不能證明它適合記憶體。</text>
<text x="40" y="598" font-size="13" fill="#91a5c1">執行階段限制、卸載、共享和峰值分配取決於設備、引擎和工作負載。</text>
</g></svg>
