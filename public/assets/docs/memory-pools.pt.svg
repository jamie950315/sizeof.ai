<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
<title id="title">Memória GPU dedicada e memória unificada da Apple</title><desc id="desc">Os sistemas de GPU dedicados possuem RAM de sistema e VRAM de GPU separados. A memória unificada da Apple é um pool físico compartilhado por CPU e GPU. Ambos precisam de espaço para pesos, estado do modelo, espaços de trabalho e outras aplicações. As caixas não estão em escala.</desc>
<rect width="1100" height="620" rx="16" fill="#111923"/>
<g font-family="system-ui,sans-serif" fill="#edf3ff">
<text x="40" y="52" font-size="24" font-weight="700">Onde mora a memória do modelo?</text>
<text x="40" y="81" font-size="15" fill="#acbbce">Propriedade conceitual da memória · fora de escala</text>
<text x="42" y="136" font-size="21" font-weight="650">GPU dedicada</text>
<text x="602" y="136" font-size="21" font-weight="650" textLength="390" lengthAdjust="spacingAndGlyphs">Memória unificada da Apple</text>
<rect x="40" y="162" width="460" height="110" rx="8" fill="#202d40" stroke="#5a7394"/>
<text x="62" y="193" font-size="18" font-weight="650" textLength="390" lengthAdjust="spacingAndGlyphs">RAM do sistema · CPU</text><text x="62" y="226" font-size="15" fill="#becae0" textLength="390" lengthAdjust="spacingAndGlyphs">SO, aplicativos, carregamento e descarregamento opcional</text>
<path d="M270 278V309" stroke="#91abc9" stroke-width="2"/><path d="m262 301 8 8 8-8" fill="none" stroke="#91abc9" stroke-width="2"/>
<text x="291" y="298" font-size="13" fill="#afc0d7">Transferências de dados</text>
<rect x="40" y="322" width="460" height="210" rx="8" fill="#16253d" stroke="#6793d9"/>
<text x="62" y="355" font-size="18" font-weight="650">GPU VRAM · capacidade separada</text>
<rect x="62" y="378" width="416" height="34" rx="4" fill="#275fac"/><text x="77" y="401" font-size="15">Pesos do modelo residente</text>
<rect x="62" y="422" width="416" height="34" rx="4" fill="#59488d"/><text x="77" y="445" font-size="15">Cache KV/estado específico da arquitetura</text>
<rect x="62" y="466" width="416" height="34" rx="4" fill="#256665"/><text x="77" y="489" font-size="15" textLength="390" lengthAdjust="spacingAndGlyphs">Espaços de trabalho de tempo de execução e outras alocações</text>
<rect x="600" y="162" width="215" height="52" rx="7" fill="#202d40" stroke="#5a7394"/><text x="685" y="195" font-size="18">CPU</text>
<rect x="845" y="162" width="215" height="52" rx="7" fill="#202d40" stroke="#5a7394"/><text x="930" y="195" font-size="18">GPU</text>
<path d="M708 219V250H950V219M830 250V257M830 282V294" fill="none" stroke="#91abc9" stroke-width="2"/>
<text x="627" y="276" font-size="13" fill="#afc0d7">Acesse o mesmo pool de memória física</text>
<rect x="600" y="294" width="460" height="238" rx="8" fill="#16253d" stroke="#6793d9"/>
<text x="622" y="325" font-size="18" font-weight="650" textLength="390" lengthAdjust="spacingAndGlyphs">Capacidade compartilhada · deixar espaço para o sistema</text>
<rect x="622" y="344" width="416" height="32" rx="4" fill="#35445d"/><text x="637" y="366" font-size="15">SO e outros aplicativos</text>
<rect x="622" y="386" width="416" height="32" rx="4" fill="#275fac"/><text x="637" y="408" font-size="15">Pesos do modelo residente</text>
<rect x="622" y="428" width="416" height="32" rx="4" fill="#59488d"/><text x="637" y="450" font-size="15">Cache KV/estado específico da arquitetura</text>
<rect x="622" y="470" width="416" height="32" rx="4" fill="#256665"/><text x="637" y="492" font-size="15" textLength="390" lengthAdjust="spacingAndGlyphs">Espaços de trabalho de tempo de execução e outras alocações</text>
<text x="40" y="572" font-size="15" fill="#bfcee2">O espaço em disco é separado de ambos os diagramas. Um modelo ajustado no disco não prova que ele cabe na memória.</text>
<text x="40" y="598" font-size="13" fill="#91a5c1" textLength="1010" lengthAdjust="spacingAndGlyphs">Os limites de tempo de execução, descarregamento, compartilhamento e alocações de pico dependem do dispositivo, do mecanismo e da carga de trabalho.</text>
</g></svg>
